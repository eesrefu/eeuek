# Cloudflare Workers deploy — GitHub Actions
#
# Gerekli repo secrets (Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN      (zorunlu)  Workers deploy yetkili Cloudflare API token'ı
#   CLOUDFLARE_ACCOUNT_ID     (opsiyonel) Boşsa Klimasun'un mevcut hesabı kullanılır
#   GEMINI_API_KEY            (opsiyonel) AI asistanı için — girildiğinde Worker secret'ı olarak yüklenir
#   GEMINI_FILE_SEARCH_STORE  (opsiyonel) Gemini File Search deposu adı
#   KV_REST_API_URL           (opsiyonel) Upstash Redis REST adresi (soru-cevap kalıcı deposu)
#   KV_REST_API_TOKEN         (opsiyonel) Upstash Redis REST token'ı
#
# Not: Repo secret'larını yalnızca Admin yetkili kullanıcılar girebilir.

name: Cloudflare Workers Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Cloudflare token kontrolü
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repo secret'ı tanımlı değil. Settings → Secrets and variables → Actions altından ekleyin."
            exit 1
          fi

      - name: Katalog + build + deploy (OpenNext → Workers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'dd8b53f237c2eba4f2a5989936672b5d' }}
        run: npm run deploy

      - name: Worker gizli değerlerini güncelle (girilenler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'dd8b53f237c2eba4f2a5989936672b5d' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1"
              echo "$1 -> Worker secret olarak yüklendi"
            else
              echo "$1 repo secret'ı boş — atlandı"
            fi
          }
          # GEMINI_FILE_SEARCH_STORE gizli değil; wrangler.jsonc vars içinde tutulur.
          put GEMINI_API_KEY "$GEMINI_API_KEY"
          put KV_REST_API_URL "$KV_REST_API_URL"
          put KV_REST_API_TOKEN "$KV_REST_API_TOKEN"
